name: Daily AI YouTube Automation

on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

jobs:
  run-automation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Python project
        run: python main.py
      - name: Upload Script and Voice
        uses: actions/upload-artifact@v4
        with:
          name: hindi-youtube-video-files
          path: |
            script.txt
            voice.mp3
          retention-days: 7
