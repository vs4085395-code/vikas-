name: Daily AI YouTube Automation

on:
  schedule:
    - cron: '30 3 * * *'

  workflow_dispatch:

jobs:
  run-automation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Python project
        run: python main.py
